<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — ReachNow</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#0D0D0D;
    --graphite:#3A3A3A;
    --ash:#E8E7E3;
    --offwhite:#F5F4F0;
    --peach:#FE8F7D;
    --brick:#A03828;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--obsidian);color:var(--offwhite);
    font-family:'Barlow',sans-serif;font-size:17px;line-height:1.6;
    min-height:100vh;display:flex;align-items:center;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--peach);outline-offset:3px;}
  .wrap{max-width:1180px;margin:0 auto;padding:64px 32px;position:relative;width:100%;}
  .n{
    position:absolute;right:-6%;top:-40%;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;
    font-size:min(70vw,760px);line-height:0.8;color:var(--peach);opacity:0.08;
    transform:skewX(-8deg);pointer-events:none;user-select:none;
  }
  .inner{position:relative;z-index:2;max-width:640px;}
  .logo{height:26px;width:auto;margin-bottom:56px;display:block;}
  .code{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:0.18em;text-transform:uppercase;color:var(--peach);
    margin-bottom:20px;display:flex;align-items:center;gap:12px;
  }
  .code::before{content:'';width:28px;height:2px;background:var(--peach);}
  h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;
    font-size:clamp(40px,7vw,80px);line-height:0.98;letter-spacing:-0.01em;margin-bottom:24px;
  }
  p{color:var(--ash);max-width:480px;margin-bottom:36px;}
  .btn{
    display:inline-block;font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:17px;letter-spacing:0.02em;text-transform:uppercase;
    padding:16px 34px;border:2px solid var(--peach);background:var(--peach);
    color:var(--obsidian);transition:all .2s ease;
  }
  .btn:hover{background:var(--brick);border-color:var(--brick);color:var(--offwhite);}
  .alt{margin-top:28px;font-size:15px;color:var(--graphite);}
  .alt a{color:var(--ash);border-bottom:1px solid var(--graphite);}
  .alt a:hover{color:var(--peach);}
  @media (prefers-reduced-motion: reduce){*{transition-duration:0.001ms !important;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="n" aria-hidden="true">N</div>
    <div class="inner">
      <a href="/"><img class="logo" src="/assets/reachnow-logo.png" alt="ReachNow" width="512" height="102"></a>
      <div class="code">Error 404</div>
      <h1>Esta página no existe.</h1>
      <p>El enlace está roto o la página cambió de lugar. Desde el inicio puedes ver qué hacemos y cómo trabajamos.</p>
      <a href="/" class="btn">Ir al inicio</a>
      <p class="alt">¿Buscabas algo puntual? Escríbenos a <a href="mailto:hola@reachnow.us">hola@reachnow.us</a></p>
    </div>
  </div>
</body>
</html>
